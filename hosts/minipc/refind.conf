# Both EFI loaders stay on their own disk; do not modify Ubuntu's ESP.
textonly
timeout 0
scanfor manual
showtools firmware,reboot,shutdown

menuentry "NixOS" {
    volume 7ffe8b6f-0211-4e4e-aacd-42e16e9a768e
    loader /EFI/systemd/systemd-bootx64.efi
}

menuentry "Ubuntu" {
    volume ed7f0566-d28a-440e-a3a5-d98059f4cf86
    loader /EFI/ubuntu/shimx64.efi
}
