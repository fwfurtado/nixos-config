config_version = 14

[bar]
order = [ "default", "Bottom" ]

    [bar.Bottom]
    center = [ "bar_2" ]
    concave_edge_corners = false
    enabled = true
    end = [ "audio_visualizer", "media" ]
    layer = "overlay"
    margin_ends = 2000
    padding = 50
    panel_overlap = 0
    position = "bottom"
    reserve_space = false
    show_on_workspace_switch = false
    smart_auto_hide = true
    start = [ "wallhaven_2", "bar_3" ]
    thickness = 45

    [bar.default]
    end = [
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "control-center",
        "session"
    ]

[brightness]
enable_ddcutil = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[dock]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 128.0
    box_width = 810.0
    cx = 2560.0
    cy = 720.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 5120.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
