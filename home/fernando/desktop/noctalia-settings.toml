[notification]
background_opacity = 0.4999999888241291
position = "top_center"
scale = 1.2000000104308128

[osd]
offset_y = 60
scale = 1.5000000149011612

[plugin_settings."ashur-d/nvim-projects"]
projects_dir = "~/projects"

[plugin_settings."noctalia/wallhaven"]
download_dir = "/home/fwfurtado/Pictures/wallpapers/pc"

[plugins]
enabled = [
    "noctalia/wallhaven",
    "kenn/keybind-cheatsheet",
    "noctalia/wallpaper_depth",
    "raycursive/github-prs",
    "ashur-d/nvim-projects"
]

[shell]
password_style = "random"
polkit_agent = true
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Eldritch"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "ghostty", "hyprland", "kitty", "niri" ]
    community_ids = [ "zed", "fuzzel", "bat", "fzf", "glow", "herdr", "yazi" ]

[wallpaper]
directory = "/home/fwfurtado/Pictures/wallpapers/32x9"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/fwfurtado/Pictures/wallpapers/32x9/wallhaven-jel5dp.png"

    [wallpaper.last]
    path = "/home/fwfurtado/Pictures/wallpapers/32x9/wallhaven-jel5dp.png"

    [wallpaper.monitors.DP-1]
    path = "/home/fwfurtado/Pictures/wallpapers/pc/wallhaven-qrppzl.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/fwfurtado/Pictures/wallpapers/32x9/wallhaven-jel5dp.png"

[widget.bar]
type = "noctalia/wallpaper_depth:bar"

[widget.bar_2]
type = "raycursive/github-prs:bar"

[widget.bar_3]
type = "noctalia/wallpaper_depth:bar"

[widget.clock]
font_weight = 700
format = "{:%D %H:%M}"
scale = 1.2

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.wallhaven_2]
type = "noctalia/wallhaven:wallhaven"
